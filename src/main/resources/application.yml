# Configuración común. Los valores sensibles se leen de variables de entorno.
# Ver .env.example para la lista completa.
spring:
  application:
    name: seguimiento-academico
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seguimiento_academico}
    username: ${DB_USERNAME:upe}
    password: ${DB_PASSWORD:upe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Clave HMAC en Base64 (mínimo 256 bits). Generar con: openssl rand -base64 32
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT8H}
